# Self-hosting: points this app at your own server (see Signal-Server/selfhost) instead of Signal's.
# Remove this file (or set selfhost.enabled=false) to build the app exactly like upstream Signal.
#
# Values that differ per machine or that you don't want committed can go in selfhost.local.properties
# (same keys; it overrides this file and is git-ignored).

selfhost.enabled=true

# Your domain. The server must answer at grpc.chat.<domain>, chat.<domain> and cdn.<domain>.
# libsignal must be built with LIBSIGNAL_CHAT_HOSTNAME=grpc.chat.<domain> (fork branch selfhost-chat-hostname).
selfhost.domain=alafandi.sy

# Android package name. Must differ from Signal's so both apps can be installed; never change it after release.
selfhost.applicationId=sy.alafandi.jiwar

# App name shown under the icon. Jiwar (جِوار): the pre-Islamic Arab custom of granting someone protection.
selfhost.appName=Jiwar
selfhost.appNameAr=جِوار

# Public values from your server's selfhost/secrets/public.yml (generated by setup.sh).
# Every app build must match the server's keys, or messaging and groups won't work.
selfhost.unidentifiedSenderTrustRoot=REPLACE_WITH_unidentifiedSenderTrustRoot
selfhost.zkGroupServerPublicParams=REPLACE_WITH_zkGroupServerPublicParams
selfhost.callLinkServerPublicParams=REPLACE_WITH_callLinkServerPublicParams
selfhost.backupServerPublicParams=REPLACE_WITH_backupServerPublicParams
